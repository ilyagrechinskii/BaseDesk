<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная — BaseDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./home.css">
</head>
<body>
  <main class="home">
    <header class="head">
      <div class="head__text">
        <h1 class="title">Добро пожаловать, Илья!</h1>
        <p class="subtitle">Ваше рабочее пространство</p>
      </div>
      <div class="head__actions">
        <button class="btn" type="button" id="add-section-btn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Добавить
        </button>
        <button class="btn btn--ai" type="button" id="ai-toggle-btn" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7z"/></svg>ИИ
        </button>
        <button class="btn btn--icon" type="button" aria-label="Уведомления" data-demo="Уведомления — скоро">
          <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <section class="grid" id="sections-grid" aria-label="Разделы рабочего пространства"></section>
      <aside class="ai-box" id="ai-box" aria-label="ИИ-помощник">
        <div class="ai-box__head">
          <span class="ai-box__badge">
            <svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7z"/></svg>
            ИИ-ассистент
          </span>
          <span class="ai-box__tag">Скоро</span>
        </div>
        <h2 class="ai-box__title">Краткая сводка и подсказки</h2>
        <p class="ai-box__text">Здесь появятся краткая сводка по рабочему пространству, подсказки и полезные рекомендации на основе ваших данных.</p>
        <div class="ai-box__placeholder" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./home.mock.js"></script>
  <script src="./home.js"></script>
</body>
</html>
